<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CB3 Cutsheet (BUF103)</title>
<link rel="stylesheet" href="./chrome.css">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
  padding: calc(var(--top-chrome, 154px) + 10px) 12px calc(24px + env(safe-area-inset-bottom));
  touch-action: manipulation; }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: rgba(11,12,14,.96); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); padding: calc(6px + env(safe-area-inset-top)) 10px 6px; }
.topbar .row1 { display: flex; align-items: center; gap: 8px; }
.back { min-height: 40px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.055);
  border: 1px solid var(--line); color: var(--muted); font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.back:active { transform: scale(.96); }
.h1 { font: 800 17px/1.1 -apple-system, sans-serif; letter-spacing: -.2px; }
.h1 small { display: block; font: 600 10.5px -apple-system, sans-serif; color: var(--dim); letter-spacing: .4px; margin-top: 2px; }
.searchwrap { display: flex; gap: 8px; margin-top: 8px; }
input[type=text] { flex: 1; min-width: 0; min-height: 44px; font-size: 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card2); color: var(--text); padding: 0 12px; }
.gobtn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #fff; color: #111;
  font: 800 14px -apple-system, sans-serif; cursor: pointer; }
.gobtn:active { transform: scale(.97); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: rgba(118,118,128,.14);
  border-radius: 10px; padding: 2px; margin-top: 8px; }
.seg button { min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.seg button.on { background: #fff; color: #111; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card2); color: var(--muted); font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.chip.on { background: #fff; color: #111; border-color: #fff; }
.chip small { opacity: .65; font-weight: 700; margin-left: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px; }
.ct { font: 800 11px -apple-system, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.fam { color: var(--amber-t); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
/* tappable connection rows - they read as controls now */
.rowbtn { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid rgba(255,255,255,.06);
  padding: 10px 0; font-size: 12.5px; cursor: pointer; color: var(--text); }
.rowbtn:first-of-type { border-top: 0; }
.rowbtn:active { background: rgba(255,255,255,.05); }
.ends { display: flex; gap: 8px; align-items: flex-start; }
.end { flex: 1; min-width: 0; }
.end .loc { font: 800 13px/1.2 ui-monospace, monospace; word-break: break-all; }
.end .dev { font: 600 11px/1.35 ui-monospace, monospace; color: var(--muted); word-break: break-all; margin-top: 2px; }
.arrow { color: var(--dim); font-size: 15px; flex: none; padding-top: 2px; }
.spec { font: 600 10.5px/1.4 ui-monospace, monospace; color: var(--dim); margin-top: 4px; word-break: break-all; }
.panel { display: inline-block; font: 700 10px ui-monospace, monospace; color: var(--green);
  border: 1px solid rgba(48,164,108,.4); border-radius: 6px; padding: 1px 6px; margin-top: 5px; }
.mrow { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; }
.mrow:first-of-type { border-top: 0; }
.mrow .n { font-weight: 800; white-space: nowrap; }
.mrow .s { color: var(--muted); font: 600 10.5px/1.4 ui-monospace, monospace; min-width: 0; word-break: break-all; text-align: right; }
.count { font: 800 11px -apple-system, sans-serif; color: var(--dim); margin: 6px 0 2px; }
.hint { color: var(--dim); font-size: 12px; margin-top: 10px; }
.err { border-color: var(--red); }
.err .ct { color: var(--red); }
button.retry { width: 100%; margin-top: 8px; min-height: 44px; border: 0; border-radius: 10px; background: #fff; color: #111; font: 700 14px -apple-system, sans-serif; }
.loadstate { color: var(--dim); font-size: 12.5px; margin-top: 12px; }
/* rack browser */
.rackgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.rackcell { min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--card2);
  color: var(--text); font: 800 12px ui-monospace, monospace; cursor: pointer;
  display: flex; align-items: center; justify-content: center; }
.rackcell:active { transform: scale(.96); background: rgba(255,255,255,.08); }
/* visual hall map: rack-density mini-grid on each hall card */
.hallmap { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; margin-top: 10px; }
.hallmap .hm-cell { height: 14px; border-radius: 2px; background: rgba(255,255,255,.06); }
.hm-0 { background: rgba(255,255,255,.06); }
.hm-1 { background: rgba(48,164,108,.2); }
.hm-2 { background: rgba(48,164,108,.4); }
.hm-3 { background: rgba(48,164,108,.6); }
.hm-4 { background: rgba(48,164,108,.85); }
/* detail sheet */
.sheetbg { position: fixed; inset: 0; z-index: 90; background: rgba(3,6,12,.88); display: none; }
.sheetbg.ov-open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; background: #141518;
  border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  display: none; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; }
.sheet.ov-open { display: block; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #3a3e45; margin: 0 auto 12px; }
.kv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.kv .k { font: 800 10px -apple-system, sans-serif; letter-spacing: .6px; color: var(--dim); text-transform: uppercase; }
.kv .v { font: 700 13px/1.35 ui-monospace, monospace; word-break: break-all; margin-top: 3px; }
.copyrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.copyrow button { min-height: 44px; border-radius: 10px; border: 0; background: #fff; color: #111; font: 700 13px -apple-system, sans-serif; cursor: pointer; }
.copyrow button.sec { background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); }
.closex { width: 100%; margin-top: 8px; min-height: 44px; border-radius: 10px; background: transparent; border: 1px dashed var(--line); color: var(--muted); font: 700 14px -apple-system, sans-serif; }
/* jsPlumb interactive trace diagrams (v76) */
.trace-instruction { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tracecard { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px; margin-top: 10px; overflow: hidden; }
.trace-hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.trace-title { font: 800 11px -apple-system, sans-serif; letter-spacing: .7px; text-transform: uppercase; color: var(--dim); }
.trace-badge { font: 700 10px ui-monospace, monospace; padding: 2px 7px; border-radius: 999px;
  background: rgba(255,255,255,.06); color: var(--muted); flex: none; }
.jtk-stage { position: relative; display: flex; justify-content: space-between; align-items: stretch;
  gap: 14px; min-height: 110px; padding: 8px 2px; width: 100%; overflow: hidden; }
.jtk-col { display: flex; flex-direction: column; justify-content: space-around; gap: 6px;
  z-index: 2; flex: 1; min-width: 0; max-width: 42%; }
.jtk-stage.multihop .jtk-col { max-width: 23%; }
.jtk-col-hdr { font: 800 9px -apple-system, sans-serif; letter-spacing: .5px; text-transform: uppercase;
  color: var(--dim); text-align: center; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jtk-node { position: relative; z-index: 2; background: var(--card2); border: 1.5px solid var(--line);
  border-radius: 9px; padding: 5px 7px; cursor: pointer; text-align: left;
  transition: opacity .16s ease, border-color .16s ease, box-shadow .16s ease; }
.jtk-node:active { transform: scale(.97); }
.jtk-node .rk { font: 800 10.5px/1.2 ui-monospace, monospace; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jtk-node .pt { font: 600 9px/1.2 ui-monospace, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.jtk-node.hl-active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.22); background: rgba(255,255,255,.09); }
.jtk-node.hl-dim { opacity: .24; }
.jtk-stage svg.jtk-connector { z-index: 1; pointer-events: stroke; cursor: pointer; transition: opacity .16s ease; }
.jtk-stage svg.jtk-connector.hl-dim { opacity: .14; }
.jtk-stage svg.jtk-connector.hl-active path { stroke-width: 3.5px; }
.trace-cables { margin-top: 8px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 6px; }
.trace-cables-hdr { display: flex; justify-content: space-between; align-items: center;
  font: 700 10px -apple-system, sans-serif; color: var(--dim); margin-bottom: 4px; }
.trace-cable-btn { display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: 100%; text-align: left; background: rgba(255,255,255,.025); border: 1px solid transparent;
  border-radius: 8px; padding: 6px 8px; margin-top: 4px; color: var(--text);
  font: 600 10.5px/1.3 ui-monospace, monospace; cursor: pointer; }
.trace-cable-btn.hl-active { border-color: var(--amber); background: rgba(245,165,36,.12); }
.trace-cable-btn .path-str { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-cable-btn .inspect-pill { flex: none; font: 800 10px -apple-system, sans-serif; color: #111;
  background: #fff; border-radius: 6px; padding: 2px 7px; }
@media (min-width: 640px) { body { max-width: 640px; margin: 0 auto; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="row1">
    <button class="back" onclick="location.href='./index.html#/home'">&#8249; MP Kit</button>
    <div class="h1">CB3 Cutsheet<small id="meta">DH1&#8211;DH4 &#183; pre-build data</small></div>
  </div>
  <div class="searchwrap">
    <input type="text" id="q" aria-label="Search the cutsheet" placeholder="Rack (dh1-r0411), device, port or spec" enterkeyhint="search" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button class="gobtn" id="go">Search</button>
  </div>
  <div class="seg" id="seg">
    <button data-v="browse" class="on">Browse</button>
    <button data-v="trace">Trace</button>
    <button data-v="mats">Materials</button>
  </div>
</div>
<div id="view">
  <div class="loadstate" id="loadstate">Loading the BUF103 cutsheet&#8230;</div>
  <div id="results"></div>
</div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<script src="./kit-data.js"></script>
<script src="./vendor/localforage/localforage.min.js"></script>
<script src="./vendor/jsplumb/jsplumb.min.js"></script>
<script>
'use strict';
/* BUF103 Cutsheet viewer v2 - interactive drill-down: hall -> racks ->
   connections; search; materials; every connection opens a detail sheet
   with copy buttons. Data bundled via the pipeline (ADR-0003). */
var D = null, FAMS = [], RACKS = {};   // RACKS = {DH1: [{rack, n}...]}
var MODE = 'browse', HALL = null, RACK = null, FAMFILTER = null, SHOWN = [];
var _jtkInstances = [];
function esc(t) { return KitData.esc(t); }
function loadDone(d) {
  D = d; FAMS = d.fams;
  buildRacks();
  document.getElementById('meta').textContent = d.src.replace(/_/g, ' ') + ' \u00b7 ' +
    d.halls.join('\u2013') + ' \u00b7 ' + totalRows().toLocaleString() + ' cables';
  document.getElementById('loadstate').style.display = 'none';
  showBrowse();
}
function load() {
  KitData.load('./data/buf103.json.gz', 'cutsheet', 'loadstate').then(function (d) {
    loadDone(d);
    try {
      var q = sessionStorage.getItem('mp.ocrq');
      if (q) { sessionStorage.removeItem('mp.ocrq'); document.getElementById('q').value = q; run(); }
    } catch (e) {}
  });
}
function totalRows() { var n = 0; FAMS.forEach(function (f) { n += D.rows[f].length; }); return n; }
function buildRacks() {
  // one pass over rows: per-rack connection counts (including intermediate hop racks), bucketed by hall
  var counts = {};
  FAMS.forEach(function (fam) {
    D.rows[fam].forEach(function (row) {
      var seen = {};
      var a = D.d[row[0]], z = D.d[row[2]];
      if (a) { counts[a] = (counts[a] || 0) + 1; seen[a] = 1; }
      if (z && !seen[z]) { counts[z] = (counts[z] || 0) + 1; seen[z] = 1; }
      if (row[6]) {
        for (var hi = 0; hi < row[6].length; hi += 3) {
          var hLoc = D.d[row[6][hi]];
          if (hLoc && !seen[hLoc]) { counts[hLoc] = (counts[hLoc] || 0) + 1; seen[hLoc] = 1; }
        }
      }
    });
  });
  RACKS = {};
  Object.keys(counts).forEach(function (loc) {
    var m = /^BUF103-(DH\d+)-R(\d+)$/.exec(loc);
    if (!m) return;
    (RACKS[m[1]] = RACKS[m[1]] || []).push({ rack: loc, n: counts[loc] });
  });
  Object.keys(RACKS).forEach(function (h) { RACKS[h].sort(function (x, y) { return x.rack < y.rack ? -1 : 1; }); });
}
/* ---------- navigation ---------- */
document.getElementById('seg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  MODE = b.getAttribute('data-v');
  document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
  render();
});
document.getElementById('go').addEventListener('click', run);
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.target.blur(); run(); } });
document.getElementById('view').addEventListener('click', function (e) {
  var hall = e.target.closest('[data-hall]');
  if (hall) { HALL = hall.getAttribute('data-hall'); RACK = null; render(); return; }
  var rk = e.target.closest('[data-rack]');
  if (rk) { RACK = rk.getAttribute('data-rack'); MODE = 'browse'; FAMFILTER = null;
    document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'browse'); });
    render(); return; }
  var fam = e.target.closest('[data-fam]');
  if (fam) { FAMFILTER = FAMFILTER === fam.getAttribute('data-fam') ? null : fam.getAttribute('data-fam'); render(); return; }
  var row = e.target.closest('[data-ri]');
  if (row) { openSheet(SHOWN[+row.getAttribute('data-ri')]); }
});
function render() {
  if (!D) return;
  if (MODE === 'mats') return showMats();
  if (MODE === 'trace') return showTrace();
  return showBrowse();
}
/* ---------- browse: halls -> racks ---------- */
function showBrowse() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (RACK) { return rackView(); }
  if (!HALL) {
    var h = document.createElement('div');
    h.className = 'count'; h.textContent = 'Pick a hall \u2014 then a rack \u2014 then a connection';
    out.appendChild(h);
    var g = document.createElement('div');
    g.className = 'card';
    var hallsHtml = D.halls.map(function (hall) {
      var racks = RACKS[hall] || [];
      var n = racks.length;
      var conns = racks.reduce(function (a, r) { return a + r.n; }, 0);
      // rack density mini-map: 16 cells, each = ~n/16 racks, colored by density
      var maxConns = Math.max.apply(null, racks.map(function (r) { return r.n; }).concat([1]));
      var cells = '';
      var cellCount = Math.min(16, Math.max(8, Math.ceil(n / 40)));
      var per = Math.ceil(n / cellCount);
      for (var ci = 0; ci < cellCount; ci++) {
        var slice = racks.slice(ci * per, (ci + 1) * per);
        var avg = slice.length ? slice.reduce(function (a, r) { return a + r.n; }, 0) / slice.length : 0;
        var lvl = avg === 0 ? 0 : avg < maxConns * 0.25 ? 1 : avg < maxConns * 0.5 ? 2 : avg < maxConns * 0.75 ? 3 : 4;
        cells += '<span class="hm-cell hm-' + lvl + '"></span>';
      }
      return '<button class="chip" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:104px;min-height:84px;border-radius:14px;" data-hall="' + esc(hall) + '">' +
        '<span style="font:800 17px ui-monospace,monospace;color:var(--text)">' + esc(hall) + '</span>' +
        '<span style="font:700 10.5px -apple-system,sans-serif;color:var(--dim)">' + n + ' racks \u00b7 ' +
        conns.toLocaleString() + ' conns</span>' +
        '<span class="hallmap">' + cells + '</span></button>';
    }).join('');
    g.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">' + hallsHtml + '</div>';
    out.appendChild(g);
    return;
  }
  // hall chosen: rack grid
  var back = document.createElement('button');
  back.className = 'chip'; back.textContent = '\u2039 All halls'; back.setAttribute('data-hall', '');
  back.addEventListener('click', function (e) { e.stopPropagation(); HALL = null; render(); });
  var h2 = document.createElement('div');
  h2.className = 'count'; h2.textContent = HALL + ' \u2014 tap a rack';
  var grid = document.createElement('div');
  grid.className = 'rackgrid';
  grid.innerHTML = (RACKS[HALL] || []).map(function (r) {
    return '<button class="rackcell" data-rack="' + esc(r.rack) + '" title="' + r.n + ' connections">R' + esc(r.rack.split('-R')[1] || '') + '</button>';
  }).join('');
  out.appendChild(back); out.appendChild(h2); out.appendChild(grid);
}
/* ---------- rack view ---------- */
function connectionsFor(rack) {
  var hits = [];
  FAMS.forEach(function (fam) {
    D.rows[fam].forEach(function (row) {
      var matched = (D.d[row[0]] === rack || D.d[row[2]] === rack);
      if (!matched && row[6]) {
        for (var hi = 0; hi < row[6].length; hi += 3) {
          if (D.d[row[6][hi]] === rack) { matched = true; break; }
        }
      }
      if (matched) hits.push([fam, row]);
    });
  });
  return hits;
}
function rackView() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (!RACK) { return showBrowse(); } // rack tab with no rack = the picker (no dead ends)
  var backBtn = document.createElement('button');
  backBtn.className = 'chip';
  backBtn.textContent = '‹ All racks';
  backBtn.addEventListener('click', function (e) { e.stopPropagation(); RACK = null; HALL = null; render(); });
  out.appendChild(backBtn);
  var all = connectionsFor(RACK);
  var groups = [];
  FAMS.forEach(function (fam) {
    var hits = all.filter(function (h) { return h[0] === fam; });
    if (hits.length && (!FAMFILTER || FAMFILTER === fam)) groups.push([fam, hits]);
  });
  var h = document.createElement('div');
  h.className = 'count';
  h.textContent = RACK + ' \u00b7 ' + all.length + ' connections';
  out.appendChild(h);
  // visual family distribution bar
  var fams2 = [];
  FAMS.forEach(function (fam) {
    var cnt = all.filter(function (x) { return x[0] === fam; }).length;
    if (cnt) fams2.push({ fam: fam, n: cnt, c: cnt / all.length });
  });
  if (fams2.length > 1) {
    var bar = document.createElement('div');
    bar.style.cssText = 'display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px;';
    var colors = ['#30a46c', '#55d0d6', '#ffca16', '#e5484d', '#6aa9e8', '#ff7ab8', '#46a758', '#f5a524'];
    bar.innerHTML = fams2.map(function (f3, i) {
      return '<span title="' + esc(f3.fam) + ': ' + f3.n + '" style="flex:' + f3.n + ';background:' + colors[i % colors.length] + '"></span>';
    }).join('');
    out.appendChild(bar);
  }
  var chips = document.createElement('div');
  chips.className = 'chiprow';
  chips.innerHTML = FAMS.map(function (fam) {
    var n = all.filter(function (x) { return x[0] === fam; }).length;
    if (!n) return '';
    var on = FAMFILTER === fam ? ' on' : '';
    return '<button class="chip' + on + '" data-fam="' + esc(fam) + '">' + esc(fam.replace(' (INTRA RACK)', '').replace(' (UPLINK)', '')) + '<small>' + n + '</small></button>';
  }).join('');
  out.appendChild(chips);
  SHOWN = [];
  groups.forEach(function (g) {
    var c = document.createElement('div');
    c.className = 'card';
    var rows = g[1].slice(0, 300).map(function (hit) {
      var ri = SHOWN.push(hit) - 1;
      return rowHtml(hit[1], ri);
    }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(g[0]) + '</span> \u00b7 ' + g[1].length + '</div>' + rows +
      (g[1].length > 300 ? '<div class="hint">Showing first 300 of ' + g[1].length + ' \u2014 use search for the rest.</div>' : '');
    out.appendChild(c);
  });
}
function rowHtml(row, ri) {
  var a = D.d[row[0]] || '?', aDev = D.d[row[1]] || '', z = D.d[row[2]] || '?', zDev = D.d[row[3]] || '';
  var spec = D.d[row[4]] || '', panel = D.d[row[5]] || '';
  return '<button class="rowbtn" data-ri="' + ri + '"><div class="ends">' +
    '<div class="end"><div class="loc">' + esc(a) + '</div><div class="dev">' + esc(aDev) + '</div></div>' +
    '<div class="arrow">\u2192</div>' +
    '<div class="end"><div class="loc">' + esc(z) + '</div><div class="dev">' + esc(zDev) + '</div></div>' +
    '</div>' + (spec ? '<div class="spec">' + esc(spec) + '</div>' : '') +
    (panel ? '<div class="panel">' + esc(panel) + '</div>' : '') + '</button>';
}
/* ---------- search ---------- */
function rackNorm(q) {
  var m = /(buf103[-/])?(dh\d)\s*[-/ ]\s*r(\d{2,4})\b/i.exec(q.trim());
  if (!m) return null;
  return 'BUF103-' + m[2].toUpperCase() + '-R' + m[3];
}
function run() {
  if (!D) { load(); return; }
  var q = document.getElementById('q').value.trim();
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (!q) { MODE = 'browse'; document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'browse'); }); return render(); }
  var rack = rackNorm(q);
  if (rack) {
    RACK = rack; HALL = null; FAMFILTER = null;
    if (MODE !== 'trace') MODE = 'browse';
    document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === MODE); });
    return render();
  }
  var t0 = performance.now();
  var qu = q.toUpperCase();
  var hit = new Set();
  for (var i = 0; i < D.d.length; i++) { if (D.d[i].toUpperCase().indexOf(qu) >= 0) hit.add(i); }
  var matches = [], LIMIT = 400;
  for (var f = 0; f < FAMS.length && matches.length < LIMIT; f++) {
    var fam = FAMS[f], rows = D.rows[fam];
    for (var r = 0; r < rows.length && matches.length < LIMIT; r++) {
      var row = rows[r];
      if (hit.has(row[0]) || hit.has(row[1]) || hit.has(row[2]) || hit.has(row[3]) || hit.has(row[4])) matches.push([fam, row]);
    }
  }
  var ms = Math.round(performance.now() - t0);
  var head = document.createElement('div');
  head.className = 'count';
  head.textContent = matches.length + (matches.length >= LIMIT ? '+' : '') + ' matches \u00b7 ' + ms + 'ms \u2014 tap a row for details';
  out.appendChild(head);
  if (!matches.length) { out.innerHTML += '<div class="hint">Nothing matches \u201c' + esc(q) + '\u201d.</div>'; return; }
  SHOWN = matches.slice();
  var byFam = {};
  matches.forEach(function (mm) { (byFam[mm[0]] = byFam[mm[0]] || []).push(mm); });
  Object.keys(byFam).forEach(function (fam) {
    var c = document.createElement('div');
    c.className = 'card';
    var rows = byFam[fam].slice(0, 60).map(function (mm, idx) { return rowHtml(mm[1], matches.indexOf(mm)); }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(fam) + '</span> \u00b7 ' + byFam[fam].length + '</div>' + rows +
      (byFam[fam].length > 60 ? '<div class="hint">Showing first 60 of ' + byFam[fam].length + '.</div>' : '');
    out.appendChild(c);
  });
}
/* ---------- materials ---------- */
function renderMatsProgress(st, mountEl) {
  if (!st || !st.halls || !mountEl) return;
  try {
    var rows = [];
    Object.keys(st.halls).forEach(function (hid) {
      if (hid.indexOf('BUF103_') !== 0) return; // hall ids stay BUF103_ (the cutsheet prefix)
      var hall = st.halls[hid];
      var total = 0, hung = 0;
      Object.keys(hall.rows || {}).forEach(function (rn) {
        ['11', '13'].forEach(function (sd) {
          var seg = hall.rows[rn][sd]; if (!seg) return;
          total++;
          if (seg.F144 === 'hung' && seg.OCS === 'hung' && seg.CAT6 === 'hung') hung++;
        });
      });
      rows.push({ name: hall.name, total: total, hung: hung,
        pct: total ? Math.round((hung / total) * 100) : 0,
        planned: (RACKS[hid.slice(7)] || []).length });
    });
    if (rows.length) {
      mountEl.innerHTML = '<div class="card"><div class="ct">Build progress ' + String.fromCharCode(0x2014) + ' walkthrough vs cutsheet</div>' +
        rows.map(function (r3) {
          return '<div class="mrow"><span class="s">' + esc(r3.name) + ' ' + String.fromCharCode(0x00b7) + ' ' + r3.hung + '/' + r3.total +
            ' sides fully hung (' + r3.pct + '%) ' + String.fromCharCode(0x00b7) + ' ' + r3.planned + ' racks planned</span><span class="n">' + r3.pct + '%</span></div>';
        }).join('') + '</div>';
    }
  } catch (e) {}
}
function showMats() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  var progSlot = document.createElement('div');
  progSlot.id = 'matsProgress';
  out.appendChild(progSlot);
  var h = document.createElement('div');
  h.className = 'count'; h.textContent = 'Planned cables by family \u2014 counts and specs from this cutsheet revision';
  // walkthrough progress for BUF103 halls (IndexedDB via localForage, fallback localStorage)
  var pLoad = (typeof localforage !== 'undefined' && localforage)
    ? localforage.getItem('mp_walkthrough_v1')
    : Promise.resolve(null);
  pLoad.then(function (st) {
    if (!st) {
      try { st = JSON.parse(localStorage.getItem('mp_walkthrough_v1') || 'null'); } catch (e) {}
    }
    renderMatsProgress(st, progSlot);
  }).catch(function () {});
  out.appendChild(h);
  FAMS.forEach(function (fam) {
    var specs = D.mats[fam] || [];
    var total = 0; specs.forEach(function (s2) { total += s2[1]; });
    var c = document.createElement('div');
    c.className = 'card';
    var rows = specs.slice(0, 8).map(function (s2) {
      return '<div class="mrow"><span class="s">' + esc(D.d[s2[0]]) + '</span><span class="n">' + s2[1].toLocaleString() + '</span></div>';
    }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(fam) + '</span> \u00b7 ' + total.toLocaleString() + ' cables</div>' + rows +
      (specs.length > 8 ? '<div class="hint">+' + (specs.length - 8) + ' more specs</div>' : '');
    out.appendChild(c);
  });
}

/* ---------- trace: interactive jsPlumb cable paths (v76) ---------- */
function shortRack(loc) {
  if (!loc) return '?';
  var p = loc.split('-R');
  return p.length > 1 ? 'R' + p[1] : loc.replace(/^BUF103-/i, '');
}
function shortDev(dev) {
  if (!dev) return '';
  var parts = dev.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(-12);
  return parts[0].slice(-8) + ' ' + parts[parts.length - 1].slice(0, 8);
}
function cableChain(row) {
  var aLoc = D.d[row[0]] || '?', aDev = D.d[row[1]] || '';
  var zLoc = D.d[row[2]] || '?', zDev = D.d[row[3]] || '';
  var steps = [{ loc: aLoc, dev: aDev, role: 'A End' }];
  if (row[6] && row[6].length >= 3) {
    for (var hi = 0; hi < row[6].length; hi += 3) {
      var hLoc = D.d[row[6][hi]] || '';
      var hLbl = row[6][hi + 1] >= 0 ? (D.d[row[6][hi + 1]] || '') : '';
      var hCab = row[6][hi + 2] >= 0 ? (D.d[row[6][hi + 2]] || '') : '';
      if (hLoc) steps.push({ loc: hLoc, dev: hLbl, cable: hCab, role: hi === 0 ? 'EOR Hop' : 'DCN Hop' });
    }
  }
  steps.push({ loc: zLoc, dev: zDev, role: 'Z End' });
  return steps;
}
function cleanupJsPlumb() {
  while (_jtkInstances.length) {
    var inst = _jtkInstances.pop();
    try { if (inst && inst.destroy) inst.destroy(); } catch (e) {}
  }
}
function showTrace() {
  cleanupJsPlumb();
  var out = document.getElementById('results');
  out.innerHTML = '';
  var q = document.getElementById('q').value.trim() || RACK || '';
  var head = document.createElement('div');
  head.className = 'count';
  head.textContent = q ? 'Tracing: ' + q : 'Type a rack (like dh1-r0411) to see its cable paths visually';
  out.appendChild(head);
  if (!q) {
    out.innerHTML += '<div class="trace-instruction">The Trace view draws interactive jsPlumb cable paths across racks (including multi-hop EOR/DCN patch panels). Tap any cable or rack node to highlight its full path, or open its detail sheet.</div>';
    return;
  }
  var rack = rackNorm(q) || RACK;
  if (!rack) { out.innerHTML += '<div class="trace-instruction">Could not parse \u201c' + esc(q) + '\u201d as a rack. Try dh1-r0411.</div>'; return; }
  RACK = rack;
  var hits = connectionsFor(rack);
  if (!hits.length) { out.innerHTML += '<div class="trace-instruction">No connections found for ' + esc(rack) + '</div>'; return; }
  renderTraceDiagram(rack, hits, out);
}

function renderTraceDiagram(rack, hits, out) {
  var famColors = { 'TPU RACK PP <> OCS': '#30a46c', 'TOR <> DCN-SPN': '#55d0d6', 'RMU + TOR <> EOR': '#ffca16',
    'MACHINE <> TOR (INTRA RACK)': '#e5484d', 'MACHINE <> TPU (INTRA RACK)': '#6aa9e8', 'MACHINE BMC <> RMU (INTRA RACK)': '#ff7ab8',
    'RMU <> BAT + RECT (INTRA RACK)': '#46a758', 'BMS <> FB0 <> FB1': '#f5a524' };
  var defaultColor = '#b0b4ba';
  var groups = [];
  FAMS.forEach(function (fam) {
    var fh = hits.filter(function (h) { return h[0] === fam; });
    if (fh.length) groups.push({ fam: fam, color: famColors[fam] || defaultColor, hits: fh });
  });
  var total = hits.length;
  var title = document.createElement('div');
  title.className = 'count';
  title.textContent = rack + ' \u00b7 ' + total + ' connections \u00b7 ' + groups.length + ' families';
  out.appendChild(title);

  // family distribution bar (v70) stays above jsPlumb diagrams
  if (groups.length > 1) {
    var bar = document.createElement('div');
    bar.style.cssText = 'display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 6px;';
    bar.innerHTML = groups.map(function (g) {
      return '<span title="' + esc(g.fam) + ': ' + g.hits.length + '" style="flex:' + g.hits.length + ';background:' + g.color + '"></span>';
    }).join('');
    out.appendChild(bar);
  }

  groups.forEach(function (g) {
    buildTraceCard(rack, g, out);
  });
}

function buildTraceCard(rack, group, out) {
  var card = document.createElement('div');
  card.className = 'tracecard';
  var maxShow = Math.min(group.hits.length, 8);
  var sampleHits = group.hits.slice(0, maxShow);
  var chains = sampleHits.map(function (h) { return cableChain(h[1]); });
  var numCols = 2;
  chains.forEach(function (ch) { if (ch.length > numCols) numCols = ch.length; });

  var hdr = document.createElement('div');
  hdr.className = 'trace-hdr';
  hdr.innerHTML = '<div class="trace-title"><span class="fam" style="color:' + group.color + '">' + esc(group.fam) +
    '</span> \u00b7 ' + group.hits.length + '</div>' +
    '<span class="trace-badge">' + (numCols > 2 ? (numCols + '-hop path') : 'direct') + '</span>';
  card.appendChild(hdr);

  var stage = document.createElement('div');
  stage.className = 'jtk-stage' + (numCols > 2 ? ' multihop' : '');
  stage.setAttribute('role', 'region');
  stage.setAttribute('aria-label', 'Interactive cable trace for ' + group.fam);
  card.appendChild(stage);

  // Build columns & deduplicated rack/device nodes per column
  var cols = [];
  var colNodeMap = [];
  var allNodes = [];
  for (var c = 0; c < numCols; c++) {
    var colEl = document.createElement('div');
    colEl.className = 'jtk-col';
    var colHdr = document.createElement('div');
    colHdr.className = 'jtk-col-hdr';
    colHdr.textContent = c === 0 ? 'A End' : (c === numCols - 1 ? 'Z End' : ('Hop ' + c));
    colEl.appendChild(colHdr);
    stage.appendChild(colEl);
    cols.push(colEl);
    colNodeMap.push({});
  }

  // Decide per-column grouping: if a column has >1 unique rack across sampleHits, group by rack+port cluster;
  // otherwise group by individual device/port so intra-rack and single-source fans are distinct.
  var colUniqueRacks = [];
  for (var c2 = 0; c2 < numCols; c2++) {
    var rset = {};
    chains.forEach(function (ch) {
      var st = ch[Math.min(c2, ch.length - 1)];
      if (st && st.loc) rset[st.loc] = 1;
    });
    colUniqueRacks.push(Object.keys(rset).length);
  }

  var cableNodeLists = [];
  chains.forEach(function (ch, cableIdx) {
    var nList = [];
    for (var colIdx = 0; colIdx < numCols; colIdx++) {
      var st = ch[Math.min(colIdx, ch.length - 1)];
      var key = colUniqueRacks[colIdx] > 1
        ? (st.loc + '::' + (st.dev ? st.dev.split(' ')[0] : ''))
        : (st.loc + '::' + (st.dev || ('idx' + cableIdx)));
      var nodeEl = colNodeMap[colIdx][key];
      if (!nodeEl) {
        nodeEl = document.createElement('button');
        nodeEl.type = 'button';
        nodeEl.className = 'jtk-node';
        nodeEl.setAttribute('data-cable-idx', String(cableIdx));
        nodeEl.innerHTML = '<div class="rk">' + esc(shortRack(st.loc)) + '</div>' +
          (st.dev ? '<div class="pt">' + esc(shortDev(st.dev)) + '</div>' : '');
        cols[colIdx].appendChild(nodeEl);
        colNodeMap[colIdx][key] = nodeEl;
        allNodes.push(nodeEl);
      }
      nList.push(nodeEl);
    }
    cableNodeLists.push(nList);
  });

  // Interactive cable list below the diagram for tap-to-highlight & tap-to-inspect
  var listWrap = document.createElement('div');
  listWrap.className = 'trace-cables';
  listWrap.innerHTML = '<div class="trace-cables-hdr"><span>Tap cable to highlight path (' +
    maxShow + ' of ' + group.hits.length + ' shown)</span><span>Inspect</span></div>';
  var cableBtns = [];
  sampleHits.forEach(function (hit, idx) {
    var ch = chains[idx];
    var pathTxt = ch.map(function (st) {
      return shortRack(st.loc) + (st.dev ? ' (' + shortDev(st.dev) + ')' : '');
    }).join(' \u2192 ');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'trace-cable-btn';
    btn.setAttribute('data-trace-idx', String(idx));
    btn.innerHTML = '<span class="path-str">' + esc(pathTxt) + '</span>' +
      '<span class="inspect-pill" data-open-sheet="' + idx + '">Details \u2197</span>';
    listWrap.appendChild(btn);
    cableBtns.push(btn);
  });
  card.appendChild(listWrap);

  // Append card to live DOM BEFORE connecting with jsPlumb so element offsets are non-zero
  out.appendChild(card);

  var cableConns = [];
  var allConns = [];
  if (typeof jsPlumb !== 'undefined' && jsPlumb.newInstance) {
    var inst = jsPlumb.newInstance({
      container: stage,
      elementsDraggable: false,
      connector: { type: 'Bezier', options: { curviness: 40 } },
      paintStyle: { strokeWidth: 2, stroke: group.color },
      endpoints: ['Blank', 'Blank'],
      anchors: ['Right', 'Left']
    });
    _jtkInstances.push(inst);
    cableNodeLists.forEach(function (nList, cIdx) {
      var cList = [];
      for (var s = 0; s < nList.length - 1; s++) {
        if (nList[s] === nList[s + 1]) continue;
        var conn = inst.connect({
          source: nList[s],
          target: nList[s + 1],
          paintStyle: { strokeWidth: 2, stroke: group.color }
        });
        if (conn) {
          cList.push(conn);
          allConns.push({ conn: conn, cableIdx: cIdx });
        }
      }
      cableConns.push(cList);
    });
  }

  var activeIdx = -1;
  function highlightCable(idx) {
    if (activeIdx === idx) { activeIdx = -1; } else { activeIdx = idx; }
    allNodes.forEach(function (nd) {
      nd.classList.remove('hl-active', 'hl-dim');
      if (activeIdx >= 0) nd.classList.add('hl-dim');
    });
    var svgs = stage.querySelectorAll('svg.jtk-connector');
    for (var si = 0; si < svgs.length; si++) {
      svgs[si].classList.remove('hl-active', 'hl-dim');
      if (activeIdx >= 0) svgs[si].classList.add('hl-dim');
    }
    cableBtns.forEach(function (b, bi) {
      b.classList.toggle('hl-active', bi === activeIdx);
    });
    if (activeIdx >= 0) {
      (cableNodeLists[activeIdx] || []).forEach(function (nd) {
        nd.classList.remove('hl-dim');
        nd.classList.add('hl-active');
      });
      (cableConns[activeIdx] || []).forEach(function (conn) {
        var el = conn && (conn.canvas || (conn.connector && conn.connector.canvas));
        if (el) {
          el.classList.remove('hl-dim');
          el.classList.add('hl-active');
        }
      });
    }
  }

  stage.addEventListener('click', function (e) {
    var nd = e.target.closest('.jtk-node');
    if (nd && nd.hasAttribute('data-cable-idx')) {
      var ci = +nd.getAttribute('data-cable-idx');
      if (activeIdx === ci) { openSheet(sampleHits[ci]); } else { highlightCable(ci); }
    }
  });
  listWrap.addEventListener('click', function (e) {
    var pill = e.target.closest('[data-open-sheet]');
    if (pill) {
      e.stopPropagation();
      openSheet(sampleHits[+pill.getAttribute('data-open-sheet')]);
      return;
    }
    var btn = e.target.closest('[data-trace-idx]');
    if (btn) {
      var ti = +btn.getAttribute('data-trace-idx');
      if (activeIdx === ti) { openSheet(sampleHits[ti]); } else { highlightCable(ti); }
    }
  });
}

/* ---------- detail sheet ---------- */
function openSheet(hit) {
  if (!hit) return;
  var fam = hit[0], row = hit[1];
  var a = D.d[row[0]], aDev = D.d[row[1]], z = D.d[row[2]], zDev = D.d[row[3]];
  var spec = D.d[row[4]] || '\u2014', panel = D.d[row[5]] || '';
  var hopsHtml = '';
  if (row[6] && row[6].length >= 3) {
    var chain = cableChain(row);
    hopsHtml = '<div class="kv"><div class="k">Full multi-hop path (' + chain.length + ' racks)</div>' +
      chain.map(function (st, idx) {
        return '<div class="v" style="font-size:11.5px;margin-top:3px">' +
          '<span style="color:var(--amber-t)">' + (idx + 1) + '. ' + esc(st.role) + ':</span> ' +
          esc(st.loc) + (st.dev ? ' \u00b7 <span style="color:var(--muted)">' + esc(st.dev) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
  }
  var sh = document.getElementById('sheet');
  sh.innerHTML = '<div class="grab"></div>' +
    '<div class="ct"><span class="fam">' + esc(fam) + '</span></div>' +
    '<div class="kv"><div class="k">A end</div><div class="v">' + esc(a) + '</div>' +
    (aDev ? '<div class="v" style="font-weight:600;color:var(--muted)">' + esc(aDev) + '</div>' : '') + '</div>' +
    hopsHtml +
    '<div class="kv"><div class="k">Z end</div><div class="v">' + esc(z) + '</div>' +
    (zDev ? '<div class="v" style="font-weight:600;color:var(--muted)">' + esc(zDev) + '</div>' : '') + '</div>' +
    '<div class="kv"><div class="k">Cable / spec</div><div class="v">' + esc(spec) + '</div>' +
    (panel ? '<div class="v" style="font-weight:600;color:var(--green);font-size:11px">' + esc(panel) + '</div>' : '') + '</div>' +
    '<div class="copyrow">' +
    '<button data-copy="' + esc(a) + '">Copy A</button>' +
    '<button data-copy="' + esc(z) + '" class="sec">Copy Z</button>' +
    '<button data-copy="' + esc(spec) + '" class="sec">Copy spec</button></div>' +
    '<button class="closex">Close</button>';
  sh.classList.add('ov-open');
  document.getElementById('sheetbg').classList.add('ov-open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('ov-open');
  document.getElementById('sheetbg').classList.remove('ov-open');
}
document.getElementById('sheetbg').addEventListener('click', closeSheet);
document.getElementById('sheet').addEventListener('click', function (e) {
  if (e.target.classList.contains('closex')) return closeSheet();
  var b = e.target.closest('button[data-copy]');
  if (b) {
    KitData.copy(b.getAttribute('data-copy'), function (ok) {
      b.textContent = ok ? 'Copied \u2713' : 'Copy failed';
      if (ok) setTimeout(closeSheet, 600);
    });
  }
});
KitData.watchFixedTop('.topbar');
load();
</script>
</body>
