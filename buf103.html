<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BUF103 Cutsheet</title>
<link rel="stylesheet" href="./chrome.css">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
  padding: calc(var(--top-chrome, 154px) + 10px) 12px calc(24px + env(safe-area-inset-bottom));
  touch-action: manipulation; }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: rgba(11,12,14,.96); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); padding: calc(6px + env(safe-area-inset-top)) 10px 6px; }
.topbar .row1 { display: flex; align-items: center; gap: 8px; }
.back { min-height: 40px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.055);
  border: 1px solid var(--line); color: var(--muted); font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.back:active { transform: scale(.96); }
.h1 { font: 800 17px/1.1 -apple-system, sans-serif; letter-spacing: -.2px; }
.h1 small { display: block; font: 600 10.5px -apple-system, sans-serif; color: var(--dim); letter-spacing: .4px; margin-top: 2px; }
.searchwrap { display: flex; gap: 8px; margin-top: 8px; }
input[type=text] { flex: 1; min-width: 0; min-height: 44px; font-size: 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card2); color: var(--text); padding: 0 12px; }
.gobtn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #fff; color: #111;
  font: 800 14px -apple-system, sans-serif; cursor: pointer; }
.gobtn:active { transform: scale(.97); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: rgba(118,118,128,.14);
  border-radius: 10px; padding: 2px; margin-top: 8px; }
.seg button { min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.seg button.on { background: #fff; color: #111; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card2); color: var(--muted); font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.chip.on { background: #fff; color: #111; border-color: #fff; }
.chip small { opacity: .65; font-weight: 700; margin-left: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px; }
.ct { font: 800 11px -apple-system, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.fam { color: var(--amber-t); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
/* tappable connection rows - they read as controls now */
.rowbtn { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid rgba(255,255,255,.06);
  padding: 10px 0; font-size: 12.5px; cursor: pointer; color: var(--text); }
.rowbtn:first-of-type { border-top: 0; }
.rowbtn:active { background: rgba(255,255,255,.05); }
.ends { display: flex; gap: 8px; align-items: flex-start; }
.end { flex: 1; min-width: 0; }
.end .loc { font: 800 13px/1.2 ui-monospace, monospace; word-break: break-all; }
.end .dev { font: 600 11px/1.35 ui-monospace, monospace; color: var(--muted); word-break: break-all; margin-top: 2px; }
.arrow { color: var(--dim); font-size: 15px; flex: none; padding-top: 2px; }
.spec { font: 600 10.5px/1.4 ui-monospace, monospace; color: var(--dim); margin-top: 4px; word-break: break-all; }
.panel { display: inline-block; font: 700 10px ui-monospace, monospace; color: var(--green);
  border: 1px solid rgba(48,164,108,.4); border-radius: 6px; padding: 1px 6px; margin-top: 5px; }
.mrow { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; }
.mrow:first-of-type { border-top: 0; }
.mrow .n { font-weight: 800; white-space: nowrap; }
.mrow .s { color: var(--muted); font: 600 10.5px/1.4 ui-monospace, monospace; min-width: 0; word-break: break-all; text-align: right; }
.count { font: 800 11px -apple-system, sans-serif; color: var(--dim); margin: 6px 0 2px; }
.hint { color: var(--dim); font-size: 12px; margin-top: 10px; }
.err { border-color: var(--red); }
.err .ct { color: var(--red); }
button.retry { width: 100%; margin-top: 8px; min-height: 44px; border: 0; border-radius: 10px; background: #fff; color: #111; font: 700 14px -apple-system, sans-serif; }
.loadstate { color: var(--dim); font-size: 12.5px; margin-top: 12px; }
/* rack browser */
.rackgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.rackcell { min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--card2);
  color: var(--text); font: 800 12px ui-monospace, monospace; cursor: pointer;
  display: flex; align-items: center; justify-content: center; }
.rackcell:active { transform: scale(.96); background: rgba(255,255,255,.08); }
/* detail sheet */
.sheetbg { position: fixed; inset: 0; z-index: 90; background: rgba(3,6,12,.88); display: none; }
.sheetbg.ov-open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; background: #141518;
  border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  display: none; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; }
.sheet.ov-open { display: block; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #3a3e45; margin: 0 auto 12px; }
.kv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.kv .k { font: 800 10px -apple-system, sans-serif; letter-spacing: .6px; color: var(--dim); text-transform: uppercase; }
.kv .v { font: 700 13px/1.35 ui-monospace, monospace; word-break: break-all; margin-top: 3px; }
.copyrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.copyrow button { min-height: 44px; border-radius: 10px; border: 0; background: #fff; color: #111; font: 700 13px -apple-system, sans-serif; cursor: pointer; }
.copyrow button.sec { background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); }
.closex { width: 100%; margin-top: 8px; min-height: 44px; border-radius: 10px; background: transparent; border: 1px dashed var(--line); color: var(--muted); font: 700 14px -apple-system, sans-serif; }
@media (min-width: 640px) { body { max-width: 640px; margin: 0 auto; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="row1">
    <button class="back" onclick="location.href='./index.html#/home'">&#8249; MP Kit</button>
    <div class="h1">BUF103 Cutsheet<small id="meta">DH1&#8211;DH4 &#183; pre-build data</small></div>
  </div>
  <div class="searchwrap">
    <input type="text" id="q" aria-label="Search the cutsheet" placeholder="Rack (dh1-r0411), device, port or spec" enterkeyhint="search" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button class="gobtn" id="go">Search</button>
  </div>
  <div class="seg" id="seg">
    <button data-v="browse" class="on">Browse</button>
    <button data-v="rack">Rack view</button>
    <button data-v="mats">Materials</button>
  </div>
</div>
<div id="view">
  <div class="loadstate" id="loadstate">Loading the BUF103 cutsheet&#8230;</div>
  <div id="results"></div>
</div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<script src="./kit-data.js"></script>
<script>
'use strict';
/* BUF103 Cutsheet viewer v2 - interactive drill-down: hall -> racks ->
   connections; search; materials; every connection opens a detail sheet
   with copy buttons. Data bundled via the pipeline (ADR-0003). */
var D = null, FAMS = [], RACKS = {};   // RACKS = {DH1: [{rack, n}...]}
var MODE = 'browse', HALL = null, RACK = null, FAMFILTER = null, SHOWN = [];
function esc(t) { return KitData.esc(t); }
function loadDone(d) {
  D = d; FAMS = d.fams;
  buildRacks();
  document.getElementById('meta').textContent = d.src.replace(/_/g, ' ') + ' \u00b7 ' +
    d.halls.join('\u2013') + ' \u00b7 ' + totalRows().toLocaleString() + ' cables';
  document.getElementById('loadstate').style.display = 'none';
  showBrowse();
}
function load() {
  KitData.load('./data/buf103.json.gz', 'cutsheet', 'loadstate').then(function (d) {
    loadDone(d);
    try {
      var q = sessionStorage.getItem('mp.ocrq');
      if (q) { sessionStorage.removeItem('mp.ocrq'); document.getElementById('q').value = q; run(); }
    } catch (e) {}
  });
}
function totalRows() { var n = 0; FAMS.forEach(function (f) { n += D.rows[f].length; }); return n; }
function buildRacks() {
  // one pass over rows: per-rack connection counts, bucketed by hall
  var counts = {};
  FAMS.forEach(function (fam) {
    D.rows[fam].forEach(function (row) {
      var a = D.d[row[0]], z = D.d[row[2]];
      if (a) counts[a] = (counts[a] || 0) + 1;
      if (z && z !== a) counts[z] = (counts[z] || 0) + 1;
    });
  });
  RACKS = {};
  Object.keys(counts).forEach(function (loc) {
    var m = /^BUF103-(DH\d+)-R(\d+)$/.exec(loc);
    if (!m) return;
    (RACKS[m[1]] = RACKS[m[1]] || []).push({ rack: loc, n: counts[loc] });
  });
  Object.keys(RACKS).forEach(function (h) { RACKS[h].sort(function (x, y) { return x.rack < y.rack ? -1 : 1; }); });
}
/* ---------- navigation ---------- */
document.getElementById('seg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  MODE = b.getAttribute('data-v');
  document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
  render();
});
document.getElementById('go').addEventListener('click', run);
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.target.blur(); run(); } });
document.getElementById('view').addEventListener('click', function (e) {
  var hall = e.target.closest('[data-hall]');
  if (hall) { HALL = hall.getAttribute('data-hall'); RACK = null; render(); return; }
  var rk = e.target.closest('[data-rack]');
  if (rk) { RACK = rk.getAttribute('data-rack'); MODE = 'rack'; FAMFILTER = null;
    document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'rack'); });
    render(); return; }
  var fam = e.target.closest('[data-fam]');
  if (fam) { FAMFILTER = FAMFILTER === fam.getAttribute('data-fam') ? null : fam.getAttribute('data-fam'); render(); return; }
  var row = e.target.closest('[data-ri]');
  if (row) { openSheet(SHOWN[+row.getAttribute('data-ri')]); }
});
function render() {
  if (!D) return;
  if (MODE === 'mats') return showMats();
  if (MODE === 'rack') return rackView();
  return showBrowse();
}
/* ---------- browse: halls -> racks ---------- */
function showBrowse() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (RACK) { return rackView(); }
  if (!HALL) {
    var h = document.createElement('div');
    h.className = 'count'; h.textContent = 'Pick a hall \u2014 then a rack \u2014 then a connection';
    out.appendChild(h);
    var g = document.createElement('div');
    g.className = 'card';
    var hallsHtml = D.halls.map(function (hall) {
      var n = (RACKS[hall] || []).length;
      return '<button class="chip" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:104px;min-height:64px;border-radius:14px;" data-hall="' + esc(hall) + '">' +
        '<span style="font:800 17px ui-monospace,monospace;color:var(--text)">' + esc(hall) + '</span>' +
        '<span style="font:700 10.5px -apple-system,sans-serif;color:var(--dim)">' + n + ' racks \u00b7 ' +
        ((RACKS[hall] || []).reduce(function (a, r) { return a + r.n; }, 0)).toLocaleString() + ' connections</span></button>';
    }).join('');
    g.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">' + hallsHtml + '</div>';
    out.appendChild(g);
    return;
  }
  // hall chosen: rack grid
  var back = document.createElement('button');
  back.className = 'chip'; back.textContent = '\u2039 All halls'; back.setAttribute('data-hall', '');
  back.addEventListener('click', function (e) { e.stopPropagation(); HALL = null; render(); });
  var h2 = document.createElement('div');
  h2.className = 'count'; h2.textContent = HALL + ' \u2014 tap a rack';
  var grid = document.createElement('div');
  grid.className = 'rackgrid';
  grid.innerHTML = (RACKS[HALL] || []).map(function (r) {
    return '<button class="rackcell" data-rack="' + esc(r.rack) + '" title="' + r.n + ' connections">R' + esc(r.rack.split('-R')[1] || '') + '</button>';
  }).join('');
  out.appendChild(back); out.appendChild(h2); out.appendChild(grid);
}
/* ---------- rack view ---------- */
function connectionsFor(rack) {
  var hits = [];
  FAMS.forEach(function (fam) {
    D.rows[fam].forEach(function (row) {
      if (D.d[row[0]] === rack || D.d[row[2]] === rack) hits.push([fam, row]);
    });
  });
  return hits;
}
function rackView() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (!RACK) { return showBrowse(); } // rack tab with no rack = the picker (no dead ends)
  var backBtn = document.createElement('button');
  backBtn.className = 'chip';
  backBtn.textContent = '‹ All racks';
  backBtn.addEventListener('click', function (e) { e.stopPropagation(); RACK = null; HALL = null; render(); });
  out.appendChild(backBtn);
  var all = connectionsFor(RACK);
  var groups = [];
  FAMS.forEach(function (fam) {
    var hits = all.filter(function (h) { return h[0] === fam; });
    if (hits.length && (!FAMFILTER || FAMFILTER === fam)) groups.push([fam, hits]);
  });
  var h = document.createElement('div');
  h.className = 'count';
  h.textContent = RACK + ' \u00b7 ' + all.length + ' connections';
  out.appendChild(h);
  var chips = document.createElement('div');
  chips.className = 'chiprow';
  chips.innerHTML = FAMS.map(function (fam) {
    var n = all.filter(function (x) { return x[0] === fam; }).length;
    if (!n) return '';
    var on = FAMFILTER === fam ? ' on' : '';
    return '<button class="chip' + on + '" data-fam="' + esc(fam) + '">' + esc(fam.replace(' (INTRA RACK)', '').replace(' (UPLINK)', '')) + '<small>' + n + '</small></button>';
  }).join('');
  out.appendChild(chips);
  SHOWN = [];
  groups.forEach(function (g) {
    var c = document.createElement('div');
    c.className = 'card';
    var rows = g[1].slice(0, 300).map(function (hit) {
      var ri = SHOWN.push(hit) - 1;
      return rowHtml(hit[1], ri);
    }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(g[0]) + '</span> \u00b7 ' + g[1].length + '</div>' + rows +
      (g[1].length > 300 ? '<div class="hint">Showing first 300 of ' + g[1].length + ' \u2014 use search for the rest.</div>' : '');
    out.appendChild(c);
  });
}
function rowHtml(row, ri) {
  var a = D.d[row[0]] || '?', aDev = D.d[row[1]] || '', z = D.d[row[2]] || '?', zDev = D.d[row[3]] || '';
  var spec = D.d[row[4]] || '', panel = D.d[row[5]] || '';
  return '<button class="rowbtn" data-ri="' + ri + '"><div class="ends">' +
    '<div class="end"><div class="loc">' + esc(a) + '</div><div class="dev">' + esc(aDev) + '</div></div>' +
    '<div class="arrow">\u2192</div>' +
    '<div class="end"><div class="loc">' + esc(z) + '</div><div class="dev">' + esc(zDev) + '</div></div>' +
    '</div>' + (spec ? '<div class="spec">' + esc(spec) + '</div>' : '') +
    (panel ? '<div class="panel">' + esc(panel) + '</div>' : '') + '</button>';
}
/* ---------- search ---------- */
function rackNorm(q) {
  var m = /(buf103[-/])?(dh\d)\s*[-/ ]\s*r(\d{2,4})\b/i.exec(q.trim());
  if (!m) return null;
  return 'BUF103-' + m[2].toUpperCase() + '-R' + m[3];
}
function run() {
  if (!D) { load(); return; }
  var q = document.getElementById('q').value.trim();
  var out = document.getElementById('results');
  out.innerHTML = '';
  if (!q) { MODE = 'browse'; document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'browse'); }); return render(); }
  var rack = rackNorm(q);
  if (rack) { RACK = rack; HALL = null; MODE = 'rack'; FAMFILTER = null;
    document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'rack'); });
    return render(); }
  var t0 = performance.now();
  var qu = q.toUpperCase();
  var hit = new Set();
  for (var i = 0; i < D.d.length; i++) { if (D.d[i].toUpperCase().indexOf(qu) >= 0) hit.add(i); }
  var matches = [], LIMIT = 400;
  for (var f = 0; f < FAMS.length && matches.length < LIMIT; f++) {
    var fam = FAMS[f], rows = D.rows[fam];
    for (var r = 0; r < rows.length && matches.length < LIMIT; r++) {
      var row = rows[r];
      if (hit.has(row[0]) || hit.has(row[1]) || hit.has(row[2]) || hit.has(row[3]) || hit.has(row[4])) matches.push([fam, row]);
    }
  }
  var ms = Math.round(performance.now() - t0);
  var head = document.createElement('div');
  head.className = 'count';
  head.textContent = matches.length + (matches.length >= LIMIT ? '+' : '') + ' matches \u00b7 ' + ms + 'ms \u2014 tap a row for details';
  out.appendChild(head);
  if (!matches.length) { out.innerHTML += '<div class="hint">Nothing matches \u201c' + esc(q) + '\u201d.</div>'; return; }
  SHOWN = matches.slice();
  var byFam = {};
  matches.forEach(function (mm) { (byFam[mm[0]] = byFam[mm[0]] || []).push(mm); });
  Object.keys(byFam).forEach(function (fam) {
    var c = document.createElement('div');
    c.className = 'card';
    var rows = byFam[fam].slice(0, 60).map(function (mm, idx) { return rowHtml(mm[1], matches.indexOf(mm)); }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(fam) + '</span> \u00b7 ' + byFam[fam].length + '</div>' + rows +
      (byFam[fam].length > 60 ? '<div class="hint">Showing first 60 of ' + byFam[fam].length + '.</div>' : '');
    out.appendChild(c);
  });
}
/* ---------- materials ---------- */
function showMats() {
  var out = document.getElementById('results');
  out.innerHTML = '';
  var h = document.createElement('div');
  h.className = 'count'; h.textContent = 'Planned cables by family \u2014 counts and specs from this cutsheet revision';
  // walkthrough progress for BUF103 halls (same-origin localStorage)
  try {
    var st = JSON.parse(localStorage.getItem('mp_walkthrough_v1') || 'null');
    if (st && st.halls) {
      var rows = [];
      Object.keys(st.halls).forEach(function (hid) {
        if (hid.indexOf('BUF103_') !== 0) return;
        var hall = st.halls[hid];
        var total = 0, hung = 0;
        Object.keys(hall.rows || {}).forEach(function (rn) {
          ['11', '13'].forEach(function (sd) {
            var seg = hall.rows[rn][sd]; if (!seg) return;
            total++;
            if (seg.F144 === 'hung' && seg.OCS === 'hung' && seg.CAT6 === 'hung') hung++;
          });
        });
        rows.push({ name: hall.name, total: total, hung: hung,
          pct: total ? Math.round((hung / total) * 100) : 0,
          planned: (RACKS[hid.slice(7)] || []).length });
      });
      if (rows.length) {
        var pc = document.createElement('div');
        pc.className = 'card';
        pc.innerHTML = '<div class=ct>Build progress ' + String.fromCharCode(0x2014) + ' walkthrough vs cutsheet</div>' +
          rows.map(function (r3) {
            return '<div class="mrow"><span class="s">' + esc(r3.name) + ' ' + String.fromCharCode(0x00b7) + ' ' + r3.hung + '/' + r3.total +
              ' sides fully hung (' + r3.pct + '%) ' + String.fromCharCode(0x00b7) + ' ' + r3.planned + ' racks planned</span><span class="n">' + r3.pct + '%</span></div>';
          }).join('');
        out.appendChild(pc);
      }
    }
  } catch (e) {}
  out.appendChild(h);
  FAMS.forEach(function (fam) {
    var specs = D.mats[fam] || [];
    var total = 0; specs.forEach(function (s2) { total += s2[1]; });
    var c = document.createElement('div');
    c.className = 'card';
    var rows = specs.slice(0, 8).map(function (s2) {
      return '<div class="mrow"><span class="s">' + esc(D.d[s2[0]]) + '</span><span class="n">' + s2[1].toLocaleString() + '</span></div>';
    }).join('');
    c.innerHTML = '<div class="ct"><span class="fam">' + esc(fam) + '</span> \u00b7 ' + total.toLocaleString() + ' cables</div>' + rows +
      (specs.length > 8 ? '<div class="hint">+' + (specs.length - 8) + ' more specs</div>' : '');
    out.appendChild(c);
  });
}
/* ---------- detail sheet ---------- */
function openSheet(hit) {
  if (!hit) return;
  var fam = hit[0], row = hit[1];
  var a = D.d[row[0]], aDev = D.d[row[1]], z = D.d[row[2]], zDev = D.d[row[3]];
  var spec = D.d[row[4]] || '\u2014', panel = D.d[row[5]] || '';
  var sh = document.getElementById('sheet');
  sh.innerHTML = '<div class="grab"></div>' +
    '<div class="ct"><span class="fam">' + esc(fam) + '</span></div>' +
    '<div class="kv"><div class="k">A end</div><div class="v">' + esc(a) + '</div>' +
    (aDev ? '<div class="v" style="font-weight:600;color:var(--muted)">' + esc(aDev) + '</div>' : '') + '</div>' +
    '<div class="kv"><div class="k">Z end</div><div class="v">' + esc(z) + '</div>' +
    (zDev ? '<div class="v" style="font-weight:600;color:var(--muted)">' + esc(zDev) + '</div>' : '') + '</div>' +
    '<div class="kv"><div class="k">Cable / spec</div><div class="v">' + esc(spec) + '</div>' +
    (panel ? '<div class="v" style="font-weight:600;color:var(--green);font-size:11px">' + esc(panel) + '</div>' : '') + '</div>' +
    '<div class="copyrow">' +
    '<button data-copy="' + esc(a) + '">Copy A</button>' +
    '<button data-copy="' + esc(z) + '" class="sec">Copy Z</button>' +
    '<button data-copy="' + esc(spec) + '" class="sec">Copy spec</button></div>' +
    '<button class="closex">Close</button>';
  sh.classList.add('ov-open');
  document.getElementById('sheetbg').classList.add('ov-open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('ov-open');
  document.getElementById('sheetbg').classList.remove('ov-open');
}
document.getElementById('sheetbg').addEventListener('click', closeSheet);
document.getElementById('sheet').addEventListener('click', function (e) {
  if (e.target.classList.contains('closex')) return closeSheet();
  var b = e.target.closest('button[data-copy]');
  if (b) {
    KitData.copy(b.getAttribute('data-copy'), function (ok) {
      b.textContent = ok ? 'Copied \u2713' : 'Copy failed';
      if (ok) setTimeout(closeSheet, 600);
    });
  }
});
KitData.watchFixedTop('.topbar');
load();
</script>
</body>
</html>
