<style id="mp-mobile-fix">
/* Friction fixes on the vendor's own (clean-auditing) light theme:
   diagrams scale to the phone instead of sideways-scrolling (their
   min-width 560px boxes caused the left-right scroll), body text gets
   phone-sized, images clamp. A full Graphite re-theme needs per-element
   work: their tokens are dual-role (text AND background), so a plain
   remap inverts 280+ pairs - measured, reverted, deferred. */
/* diagrams are light-drawn: mount them on light plates, sized to the phone */
figure.fig .svgbox { background: #f5f2eb; border-radius: 12px; padding: 10px;
  overflow-x: visible !important; }
figure.fig svg.dg { min-width: 0 !important; width: 100% !important; height: auto; }
img { max-width: 100%; height: auto; }
/* phone-sized reading: bigger body text, meta no longer print-tiny */
@media (max-width: 720px) {
  html, body { overflow-x: clip; }
  main p, main li, .lesson p, .lesson li { font-size: 15.5px; line-height: 1.62; }
  main .muted, main .meta, .lesson .muted { font-size: 13px !important; }
  /* wide tables (l13 had a 560px one) stack into labeled cards - the same
     treatment the Field Reference got; no content past a scroll edge */
  table { display: block; width: 100%; }
  table thead { display: none; }
  table tr { display: block; background: rgba(0,0,0,.035);
    border: 1px solid rgba(0,0,0,.13); border-radius: 10px;
    padding: 6px 10px; margin: 8px 0; }
  table td { display: block; border: 0; padding: 3px 0; text-align: left; }
  table td[data-label]:not([data-label=""])::before {
    content: attr(data-label) ": "; font-weight: 700; opacity: .55; font-size: .85em; }
}
</style>
<style id="mp-graphite">
/* MP Kit Graphite identity - component-level overrides (v65).
   The v57 token-remap failed because their CSS vars are dual-role (text
   AND background). This layer targets their actual components with
   explicit values instead. Diagrams (svg.dg) stay on light plates. */
:root { color-scheme: dark; }
html, body { background: #0b0c0e !important; color: #edeef0 !important; }
body { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif !important; }

/* surfaces */
.card, .box, .lsec, figure.fig, .checklists, .matchrow { background: #111113 !important;
  border: 1px solid #363a3f !important; border-radius: 14px !important;
  box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3) !important; }
.hero { background: linear-gradient(180deg, #141519, #0b0c0e) !important; }

/* text */
body, p, li, td, th, dt, dd, figcaption, .muted { color: #b0b4ba !important; }
h1, h2, h3, h4, b, strong, .brand b, .term { color: #edeef0 !important; }
a { color: #55d0d6 !important; }
code, pre, .mono { background: #1b1d20 !important; color: #d3d6db !important;
  border: 1px solid #2a2d33 !important; border-radius: 6px !important; }
::placeholder { color: #777b84 !important; }

/* buttons + interactive */
.btn, button { background: rgba(255,255,255,.06) !important; color: #edeef0 !important;
  border: 1px solid #363a3f !important; border-radius: 10px !important; }
.btn.pri, .btn.fib, button.pri { background: #fff !important; color: #111 !important;
  border-color: #fff !important; font-weight: 700 !important; }
.btn:active, button:active { transform: scale(0.96) !important; }

/* progress + status */
.prog, .pbar { background: rgba(255,255,255,.08) !important; }
.prog .pbar, .pbar > div { background: #30a46c !important; }
.done-badge { background: #12271a !important; color: #46a758 !important;
  border: 1px solid rgba(48,164,108,.4) !important; }

/* inputs */
input, select, textarea { background: #18191b !important; color: #edeef0 !important;
  border: 1px solid #363a3f !important; border-radius: 10px !important; }

/* diagrams: light plates (they are drawn for light backgrounds) */
figure.fig .svgbox { background: #f5f2eb !important; border-radius: 12px !important;
  padding: 10px !important; overflow-x: visible !important; }
figure.fig svg.dg { min-width: 0 !important; width: 100% !important; height: auto !important; }
img { max-width: 100% !important; height: auto !important; }

/* tables: stacked labeled cards on phones (the proven pattern) */
@media (max-width: 720px) {
  html, body { overflow-x: clip !important; }
  table { display: block !important; width: 100% !important; }
  table thead { display: none !important; }
  table tr { display: block !important; background: rgba(255,255,255,.03) !important;
    border: 1px solid rgba(255,255,255,.08) !important; border-radius: 10px !important;
    padding: 8px 10px !important; margin: 8px 0 !important; }
  table td { display: block !important; border: 0 !important; padding: 3px 0 !important;
    text-align: left !important; color: #b0b4ba !important; }
  table td[data-label]:not([data-label=""])::before {
    content: attr(data-label) ": "; font-weight: 700; opacity: .55; font-size: .85em; }
}
/* phone reading sizes */
@media (max-width: 720px) {
  main p, main li, .lesson p, .lesson li { font-size: 15.5px !important; line-height: 1.62 !important; }
  main .muted, .lesson .muted { font-size: 13px !important; }
}

/* accent callout boxes + specific light-bg components (v65 finding:
   objectives/connector-lists/etc. carry inline soft-accent bgs) */
.objectives, .notice, .callout, .tip, .warning, .info-box,
.pgrid li, ol.stripe li, .matchrow { background: #18191b !important;
  border: 1px solid #363a3f !important; border-radius: 10px !important; }
h2, h3 { background: transparent !important; }
a { background: transparent !important; }
td, th, li { background: transparent !important; }
table { background: transparent !important; }
table.t { background: #111113 !important; border: 1px solid #363a3f !important; border-radius: 10px !important; }
/* kill ALL remaining soft-accent inline backgrounds in content areas */
main [style*="background"], .lesson [style*="background"],
main [style*="--teal-soft"], main [style*="--amber-soft"],
main [style*="--hl-soft"], main [style*="--ok-soft"],
main [style*="--bad-soft"], main [style*="--info-soft"], main [style*="--warn-soft"] {
  background: #18191b !important; border-radius: 10px !important; border: 1px solid #363a3f;
}
/* the connector-color chart: li items with white bg - dark them */
ol li, ul li { background: transparent !important; }

/* NUCLEAR: kill every background in content areas, then restore known-good.
   This catches inline styles, JS-set bgs, and any vendor class we missed. */
main *, .lesson *, #content *, article *, section *,
.pgrid *, ol *, ul *, .fig-tools * { background-color: transparent !important; }
/* restore surfaces + status elements */
main .card, .lesson .card, main .box, .lesson .box,
main table.t, .lesson table.t, main .objectives, .lesson .objectives {
  background-color: #111113 !important; }
main pre, main code, .lesson pre, .lesson code { background-color: #1b1d20 !important; }
figure.fig .svgbox { background-color: #f5f2eb !important; }
.prog .pbar, .prog .pbar > div { background-color: #30a46c !important; }
.done-badge { background-color: #12271a !important; }
/* kicker + sub text: bump to readable on dark */
.kicker, .sub, .muted, figcaption { color: #777b84 !important; opacity: 1 !important; }
em { color: #9aa0a8 !important; }
.formula { background-color: #1b1d20 !important; color: #d3d6db !important;
  border: 1px solid #2a2d33 !important; border-radius: 8px !important; }

/* final stragglers: specific text colors + the last light-bg elements */
span.stage-tag { color: #6aa9e8 !important; }
.kicker, .sub { color: #8a919c !important; }
p.muted, .muted { color: #8a919c !important; }
em { color: #a0a7b0 !important; }
a { background: transparent !important; }
h2, h3 { background: transparent !important; }
title { color: inherit !important; }
/* kill the #EEE9DF bg anywhere it still exists */
[style*="238, 233, 223"], [style*="#EEE9DF"], [style*="#eee9df"] {
  background: #18191b !important; }
/* broader: any heading or link inside the topbar/brand area */
.topbar *, .brand *, .side *, .menu-btn { background: transparent !important; }
.topbar { background: rgba(11,12,14,.96) !important; }
</style>

<body><script id="mp-table-labels">
(function () {
  function labelTables() {
    document.querySelectorAll('table').forEach(function (tb) {
      if (tb.getAttribute('mp-labeled')) return;
      var head = tb.querySelectorAll('thead th, tr:first-child th');
      var labels = Array.from(head).map(function (h) { return (h.textContent || '').trim().slice(0, 18); });
      if (!labels.length) return;
      tb.setAttribute('mp-labeled', '1');
      tb.querySelectorAll('tr').forEach(function (tr) {
        if (tr.querySelector('th')) return;
        Array.from(tr.querySelectorAll('td')).forEach(function (td, i) { td.setAttribute('data-label', labels[i] || ''); });
      });
    });
  }
  new MutationObserver(function () { setTimeout(labelTables, 50); })
    .observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', labelTables);
})();
