<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scan a Label</title>
<link rel="stylesheet" href="./chrome.css">
<style>
body { margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
  padding: calc(var(--top-chrome, 110px) + 14px) 14px calc(20px + env(safe-area-inset-bottom));
  touch-action: manipulation; }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: rgba(11,12,14,.96); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); padding: calc(6px + env(safe-area-inset-top)) 10px 8px; }
.row1 { display: flex; align-items: center; gap: 8px; }
.h1 { font: 800 17px/1.1 -apple-system, sans-serif; }
.h1 small { display: block; font: 600 10.5px -apple-system, sans-serif; color: var(--dim); margin-top: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px; min-width: 0; box-sizing: border-box; }
.ct { font: 800 11px -apple-system, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.modebar { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: rgba(118,118,128,.14);
  border-radius: 10px; padding: 2px; margin-top: 8px; }
.modebar button { min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  font: 800 12.5px -apple-system, sans-serif; cursor: pointer; }
.modebar button.on { background: #fff; color: #111; }
.scanwrap { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; background: #000;
  min-height: 300px; display: none; }
.scanwrap.ov-open { display: block; }
.scanwrap video { width: 100%; display: block; min-height: 300px; object-fit: cover; }
.reticle { position: absolute; left: 6%; right: 6%; top: 28%; height: 38%;
  border-radius: 12px; box-shadow: 0 0 0 200vmax rgba(0,0,0,.45);
  border: 2px solid rgba(255,255,255,.85); pointer-events: none; }
.reticle::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 46%, rgba(255,255,255,.85) 46%, rgba(255,255,255,.85) 54%, transparent 54%);
  animation: sweep 2.2s cubic-bezier(0.2, 0, 0, 1) infinite; }
@media (prefers-reduced-motion: reduce) { .reticle::after { animation: none; opacity: .35; } }
@keyframes sweep { 0% { transform: translateY(-46%); } 50% { transform: translateY(46%); } 100% { transform: translateY(-46%); } }
.scanbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.scanbar button { min-height: 52px; border-radius: 14px; border: 0; font: 800 14px -apple-system, sans-serif; cursor: pointer; }
.scanbar .shooting { background: #fff; color: #111; }
.scanbar .cancel { background: rgba(255,255,255,.07); border: 1px solid var(--line) !important; color: var(--text); }
.door { display: flex; align-items: center; gap: 12px; text-align: left; max-width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; cursor: pointer; color: var(--text); width: 100%; min-width: 0; box-sizing: border-box;
  transition: transform 150ms cubic-bezier(0.2, 0, 0, 1); }
.door:active { transform: scale(0.96); }
.door svg { width: 26px; height: 26px; flex: none; color: var(--muted); }
.door > span { min-width: 0; }
.door .dn { font: 800 15px -apple-system, sans-serif; }
.door .ds { font: 600 11.5px -apple-system, sans-serif; color: var(--muted); margin-top: 2px; }
.doors { display: grid; gap: 10px; margin-top: 12px; min-width: 0; }
input[type=file] { display: none; }
.status { font: 700 12px -apple-system, sans-serif; color: var(--muted); margin-top: 10px; }
.hit { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 1px solid rgba(48,164,108,.5); background: rgba(48,164,108,.08);
  border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.hit .code { font: 800 16px ui-monospace, monospace; word-break: break-all; }
.hit .go { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #fff; color: #111;
  font: 800 13px -apple-system, sans-serif; cursor: pointer; flex: none; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pchip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px;
  font: 700 12.5px ui-monospace, monospace; color: var(--text); background: var(--card2); cursor: pointer; }
.pchip:active { transform: scale(0.96); }
.pchip small { color: var(--dim); font: 700 9.5px -apple-system, sans-serif; display: block; letter-spacing: .5px; }
.rawtext { font: 600 12px/1.6 ui-monospace, monospace; color: var(--muted);
  word-break: break-all; white-space: pre-wrap; max-height: 180px; overflow-y: auto; overscroll-behavior: contain; }
.copybtn { margin-top: 10px; width: 100%; min-height: 44px; border: 0; border-radius: 10px;
  background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text);
  font: 700 13px -apple-system, sans-serif; }
.hint { color: var(--dim); font-size: 12px; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="row1">
    <a class="mp-back-pill" style="position:static" href="./index.html#/home">&#8249; MP Kit</a>
    <div class="h1">Scan a Label<small>barcodes instantly \u00b7 printed text via OCR</small></div>
  </div>
  <div class="modebar" id="modebar">
    <button data-m="barcode" class="on">Barcode</button>
    <button data-m="text">Printed text (OCR)</button>
  </div>
</div>
<div id="mount">
  <div class="doors">
    <button class="door" id="doorLive" aria-label="Scan with the camera">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" x2="17" y1="12" y2="12"/></svg>
      <span><span class="dn">Scan with camera</span><span class="ds" id="liveHint">Barcodes decode live in the frame</span></span>
    </button>
    <label class="door" for="snap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span><span class="dn">Take photo / choose image</span><span class="ds">Good for both modes</span></span>
    </label>
    <input type="file" id="snap" accept="image/*" capture="environment">
  </div>
  <div id="results"></div>
</div>
<div class="scanwrap" id="scanwrap">
  <video id="video" playsinline muted></video>
  <div class="reticle"></div>
</div>
<div class="scanbar" id="scanbar" style="display:none">
  <button class="shooting" id="shoot">Capture</button>
  <button class="cancel" id="cancelScan">Stop</button>
</div>
<script src="./kit-data.js"></script>
<script src="./vendor/zxing/reader.js"></script>
<script src="./vendor/tesseract/tesseract.min.js"></script>
<script>
'use strict';
/* Scan a Label - ONE kit-native scanner, two engines:
   - Barcode mode: zxing wasm decodes every video frame; a hit shows the
     code + a jump into the barcode directory.
   - Text mode: capture a frame, tesseract reads the printed label, the
     confusion-tolerant parser turns it into lookup chips (BUF103 etc).
   Replaces both the guide's 'whole new app' scanner and the separate
   Read-a-Label page. */
var MODE = 'barcode', stream = null, zxReady = null, zxTimer = null;

document.getElementById('modebar').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  MODE = b.getAttribute('data-m');
  document.querySelectorAll('#modebar button').forEach(function (x) { x.classList.toggle('on', x === b); });
  document.getElementById('liveHint').textContent = MODE === 'barcode'
    ? 'Barcodes decode live in the frame'
    : 'Frame the printed text, then Capture';
  if (stream) { stopLive(); startLive(); }
});

document.getElementById('doorLive').addEventListener('click', startLive);
document.getElementById('cancelScan').addEventListener('click', stopLive);
document.getElementById('shoot').addEventListener('click', function () {
  var v = document.getElementById('video');
  if (!v.videoWidth) { setStatus('Camera not ready yet\u2026'); return; }
  var cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  stopLive();
  if (MODE === 'barcode') decodeCanvas(cv);
  else { setStatus('Reading\u2026'); ocrImage(cv); }
});
document.getElementById('snap').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  stopLive();
  var img = new Image();
  img.onload = function () {
    var cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext('2d').drawImage(img, 0, 0);
    if (MODE === 'barcode') decodeCanvas(cv);
    else { setStatus('Reading\u2026'); ocrImage(cv); }
  };
  img.src = URL.createObjectURL(f);
});

/* ---------- camera ---------- */
function startLive() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    setStatus('Live camera not available here - use the photo option.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
    stream = s;
    var v = document.getElementById('video');
    v.srcObject = s; v.play();
    document.getElementById('scanwrap').classList.add('ov-open');
    document.getElementById('scanbar').style.display = 'grid';
    if (MODE === 'barcode') { setStatus('Scanning for barcodes\u2026'); zxTimer = setInterval(zxTick, 400); }
    else setStatus('Frame the printed text, then Capture.');
  }).catch(function (err) {
    setStatus('Camera blocked (' + (err.name || 'error') + ') - use the photo option.');
  });
}
function stopLive() {
  if (zxTimer) { clearInterval(zxTimer); zxTimer = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  document.getElementById('scanwrap').classList.remove('ov-open');
  document.getElementById('scanbar').style.display = 'none';
}

/* ---------- zxing barcode ---------- */
function zxLoad() {
  if (zxReady) return zxReady;
  zxReady = new Promise(function (resolve, reject) {
    try {
      var mod = window.ZXingWASM || window.zxingwasm;
      if (!mod) throw new Error('no reader');
      var boot = mod.then ? mod : Promise.resolve(mod);
      boot.then(function (m) {
        var M = m || window.ZXingWASM;
        var ready = M.ready ? M.ready() : Promise.resolve();
        ready.then(function () { resolve(M); });
      }).catch(reject);
    } catch (e) { reject(e); }
  });
  return zxReady;
}
function zxTick() {
  var v = document.getElementById('video');
  if (!v.videoWidth) return;
  var cv = document.createElement('canvas');
  // ROI strip like the guide scanner: fewer pixels, more hits
  var w = Math.floor(v.videoWidth * 0.9), h = Math.floor(v.videoHeight * 0.34);
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(v, Math.floor((v.videoWidth - w) / 2), Math.floor((v.videoHeight - h) / 2), w, h, 0, 0, w, h);
  decodeCanvas(cv, true);
}
function decodeCanvas(cv, quiet) {
  zxLoad().then(function (M) {
    var out = [];
    try {
      var res = M.readBarcodesFromImageData(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
      out = (res || []).map(function (r) { return r && (r.text || r.rawValue); }).filter(Boolean);
    } catch (e) {}
    if (out.length) {
      stopLive();
      barcodeHit(out[0]);
    } else if (!quiet) {
      setStatus('No barcode found - try Text mode for printed labels.');
    }
  }).catch(function (e) {
    setStatus('Scanner engine failed to load - Text mode still works.');
  });
}
function barcodeHit(code) {
  setStatus('Barcode found \u2713');
  var is103 = /BUF103/i.test(code);
  var box = document.getElementById('results');
  box.innerHTML = '<div class="hit" style="flex-wrap:wrap;"><span class="code" style="width:100%;margin-bottom:6px;">' + KitData.esc(code) + '</span>' +
    '<div style="display:flex;gap:8px;width:100%;">' +
    '<button class="go" id="goBuf103" style="flex:1;' + (is103 ? '' : 'background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--line);') + '">Search CB3 (BUF103)</button>' +
    '<button class="go" id="goDir" style="flex:1;' + (!is103 ? '' : 'background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--line);') + '">Search CB4/5 Dir</button>' +
    '</div></div>';
  document.getElementById('goBuf103').onclick = function () {
    try { sessionStorage.setItem('mp.ocrq', code); } catch (e) {}
    location.href = './buf103.html';
  };
  document.getElementById('goDir').onclick = function () {
    try { sessionStorage.setItem('mp.ocrq', code); } catch (e) {}
    try { sessionStorage.setItem('mp_embed', '1'); } catch (e) {}
    location.href = './guide.html#/find';
  };
}

/* ---------- OCR text mode ---------- */
function ocrImage(cv) {
  Tesseract.recognize(cv, 'eng', {
    corePath: './vendor/tesseract/',
    langPath: './vendor/tesseract',
    workerPath: './vendor/tesseract/worker.min.js',
    logger: function (m) { if (m.status === 'recognizing text') setStatus('Reading\u2026 ' + Math.round(m.progress * 100) + '%'); }
  }).then(function (res) {
    var text = (res && res.data && res.data.text) || '';
    setStatus('Done');
    renderTextResults(text);
  }).catch(function (err) {
    setStatus('OCR failed: ' + (err && err.message ? err.message : err));
  });
}
function parseLabel(text) {
  var out = [];
  var push = function (kind, val) {
    if (val && !out.some(function (o) { return o.val === val; })) out.push({ kind: kind, val: val });
  };
  var upper = text.toUpperCase();
  var norm = upper.replace(/O/g, '0').replace(/[IL|]/g, '1').replace(/S/g, '5');
  [upper, norm].forEach(function (src) {
    (src.match(/BUF\d+#\d+/g) || []).forEach(function (b) { push('barcode', b); });
    (src.match(/BUF\d+-DH\d+-R\d{4}/g) || []).forEach(function (r) { push('location', r); });
    (src.match(/\bR\s?\d{4}\b/g) || []).forEach(function (r) { push('rack', r.replace(/\s/g, '')); });
  });
  (norm.match(/\bR[\d]{5,6}\b/g) || []).forEach(function (r) {
    var digits = r.slice(1);
    for (var i = 0; i < digits.length; i++) {
      var cand = 'R' + digits.slice(0, i) + digits.slice(i + 1);
      if (cand.length === 5) push('rack?', cand);
    }
  });
  (upper.match(/ETH[\w/.:-]*|\bQSFP\d?\b|\bMPO-?\d?\b/g) || []).forEach(function (p) { push('port', p); });
  return out;
}
function renderTextResults(text) {
  var box = document.getElementById('results');
  var hits = parseLabel(text);
  var html = '';
  if (hits.length) {
    html += '<div class="card"><div class="ct">Found in the text \u2014 tap to look it up</div><div class="chiprow">';
    hits.forEach(function (h) {
      html += '<a class="pchip" href="#" onclick="goQ(\'' + h.val.replace(/'/g, '') + '\');return false;">' +
        KitData.esc(h.val) + '<small>' + h.kind + ' \u00b7 search</small></a>';
    });
    html += '</div></div>';
  }
  html += '<div class="card"><div class="ct">Raw text</div>' +
    '<div class="rawtext">' + (KitData.esc(text.trim()) || '(nothing recognized \u2014 try more light / closer)') + '</div>' +
    '<button class="copybtn" id="copyAll">Copy text</button></div>';
  box.innerHTML = html;
  document.getElementById('copyAll').onclick = function () {
    var b = this;
    KitData.copy(text.trim(), function (ok) { b.textContent = ok ? 'Copied \u2713' : 'Copy failed'; });
  };
}
function goQ(q) {
  try { sessionStorage.setItem('mp.ocrq', q); } catch (e) {}
  if (/^BUF102/i.test(q)) {
    try { sessionStorage.setItem('mp_embed', '1'); } catch (e) {}
    location.href = './guide.html#/find';
  } else {
    location.href = './buf103.html';
  }
}
function setStatus(t) {
  var el = document.getElementById('status');
  if (!el) {
    el = document.createElement('div'); el.id = 'status'; el.className = 'status';
    document.getElementById('mount').appendChild(el);
  }
  el.textContent = t;
}
KitData.watchFixedTop('.topbar');
</script>
</body>
</html>
